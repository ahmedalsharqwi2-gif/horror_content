# === تعديل جديد مهم ===
# كان فيه اتنين cron (13:00 و 17:00 UTC) — ده غلط لو هدفك نشر جزئين من
# *نفس* الحلقة على الساعة 3 والساعة 7: التشغيل الثاني (17:00) كان هيولّد
# حلقة كاملة جديدة تمامًا بدل ما يكمّل الحلقة اللي بدأت الساعة 3.
# الحل: كرون واحد بس الساعة 13:00 UTC (= 3 عصرًا بتوقيت القاهرة UTC+2).
# السكريبت بينشر الجزء الأول فورًا، وبيجدول الجزء الثاني عن طريق Buffer
# نفسها (dueAt) بعد PART2_DELAY_HOURS ساعة (4 ساعات افتراضيًا = 7 مساءً).

name: Create and Publish Horror Episode

on:
  schedule:
    - cron: "0 13 * * *" # 3 عصراً بتوقيت القاهرة عند UTC+2 — الجزء الأول ينشر فورًا، الجزء الثاني بيتجدول تلقائيًا الساعة 7 مساءً عن طريق Buffer
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate script (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Fetch real stock clips (Pexels)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate human-like voice + synced subtitles (edge-tts)
        run: python scripts/generate_voice.py

      - name: Assemble final video with burned captions (ffmpeg)
        run: python scripts/assemble_video.py

      - name: Publish directly via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          # لازم نفس المعرّفات دي تكون جزء من BUFFER_CHANNEL_ID كمان
          # (مفصولة بفواصل)، عشان الخدمة تتعرّف صح لكل قناة.
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # الفرق بين نشر الجزء الأول (3 عصرًا، فوري) والجزء الثاني
          # (يتجدول تلقائيًا) — 4 ساعات بالضبط = 7 مساءً بالتمام.
          PART2_DELAY_HOURS: "4"
        run: python scripts/publish_buffer.py

      - name: Upload video as artifact (for your own records)
        uses: actions/upload-artifact@v4
        with:
          name: published-video
          # final_video.mp4 (حلقة واحدة) أو final_video_part1.mp4 +
          # final_video_part2.mp4 (حلقة متقسمة)
          path: output/final_video*.mp4
          retention-days: 14
          if-no-files-found: error

      - name: Commit updated clip-tracking state
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json
          git commit -m "chore: update used clips tracking [skip ci]" || echo "لا يوجد تغيير"
          git push
