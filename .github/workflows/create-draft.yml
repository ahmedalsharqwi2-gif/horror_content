name: Create and Publish Horror Episode

on:
  schedule:
    - cron: "0 13 * * *" # 3 عصراً بتوقيت القاهرة عند UTC+2
    - cron: "0 17 * * *" # 7 مساءً بتوقيت القاهرة عند UTC+2
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate script (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Fetch real stock clips (Pexels)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate human-like voice + synced subtitles (edge-tts)
        run: python scripts/generate_voice.py

      - name: Assemble final video with burned captions (ffmpeg)
        run: python scripts/assemble_video.py

      - name: Publish directly via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # الجزء التاني (لو الحلقة اتقسمت) بيتجدول بعد المدة دي بالساعات.
          # 6 ساعات مختارة عمدًا عشان متتصادمش مع تشغيلة الـ cron الجاية
          # (13:00 أو 17:00 UTC) — 4 أو 24 ساعة بتهبط بالظبط على تشغيلة
          # تانية وبتعمل بوست مزدوج على نفس القناة في نفس اللحظة تقريبًا.
          PART2_DELAY_HOURS: "6"
        run: python scripts/publish_buffer.py

      - name: Upload video as artifact (for your own records)
        uses: actions/upload-artifact@v4
        with:
          name: published-video
          # final_video.mp4 (حلقة واحدة) أو final_video_part1.mp4 +
          # final_video_part2.mp4 (حلقة متقسمة) — الاسم الثابت القديم
          # كان بيفوّت الأرشفة تمامًا في حالة التقسيم.
          path: output/final_video*.mp4
          retention-days: 14
          # يفشل الخطوة بوضوح لو مفيش أي فيديو خالص، بدل ما يمر بصمت
          # (warn) ونكتشف المشكلة بعد كام يوم بس.
          if-no-files-found: error

      - name: Commit updated clip-tracking state
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json
          git commit -m "chore: update used clips tracking [skip ci]" || echo "لا يوجد تغيير"
          git push
